<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main>
            <form>
                <input type="color" name="scheme-color" />
                <select name="scheme-mode" class="scheme-modes-select"></select>
                <button type="submit">Get color scheme</button>
            </form>
            <ul class="color-scheme-list">
                <li>
                    <div class="color-swatch" id="color1"></div>
                    <button class="hex-label" id="hex1">#F55A5A</button>
                </li>
                <li>
                    <div class="color-swatch" id="color2"></div>
                    <button class="hex-label" id="hex2">#2B283A</button>
                </li>
                <li>
                    <div class="color-swatch" id="color3"></div>
                    <button class="hex-label" id="hex3">#FBF3AB</button>
                </li>
                <li>
                    <div class="color-swatch" id="color4"></div>
                    <button class="hex-label" id="hex4">#AAD1B6</button>
                </li>
                <li>
                    <div class="color-swatch" id="color5"></div>
                    <button class="hex-label" id="hex5">#A626D3</button>
                </li>
            </ul>
        </main>
        <script src="index.js" type="module"></script>
    </body>
</html>
